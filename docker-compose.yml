services:
  db:
    image: postgres:16-alpine
    container_name: amazon-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rb2f_admin
      POSTGRES_PASSWORD: MyStrongPass123 # password
      POSTGRES_DB: amazon_dashboard      # database name
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
